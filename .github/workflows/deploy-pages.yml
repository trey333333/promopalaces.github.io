name: Deploy allowlisted GitHub Pages artifact

on:
  workflow_dispatch:
    inputs:
      decision_id:
        description: Active owner decision ID recorded in governance/decision-log.json
        required: true
        type: string
      task_id:
        description: Backlog task ID covered by the deployment decision
        required: true
        type: string

permissions: {}

concurrency:
  group: promopalaces-github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package approved public assets
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the approved revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Validate governance metadata
        run: node tools/validate-orchestrator.mjs
      - name: Validate deployment authorization
        env:
          DECISION_ID: ${{ inputs.decision_id }}
          TASK_ID: ${{ inputs.task_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: node tools/validate-deployment-authorization.mjs --decision-id "$DECISION_ID" --task-id "$TASK_ID" --commit-sha "$COMMIT_SHA"
      - name: Run public-artifact checks
        run: node --test tests/public-artifact.test.mjs tests/deployment-safety.test.mjs
      - name: Build allowlisted public artifact
        run: node tools/build-public-site.mjs --artifact public-site
      - name: Verify public artifact contents
        run: node tools/validate-public-artifact.mjs --artifact public-site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public-site

  deploy:
    name: Deploy reviewed Pages artifact
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact after environment approval
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
